<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<meta name="description" content="ブラウザだけで完結するカラーグレーディング特化の画像編集ツール。映画・フィルム・カメラアプリ風プリセットとイラスト仕上げ加工。">
<title>Simple Color Grading</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23222'/%3E%3Ccircle cx='12' cy='16' r='7' fill='%23fff' opacity='.9'/%3E%3Ccircle cx='20' cy='16' r='7' fill='%23fff' opacity='.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand" title="Simple Color Grading">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor" opacity=".15"/><circle cx="12" cy="16" r="7" fill="currentColor" opacity=".9"/><circle cx="20" cy="16" r="7" fill="currentColor" opacity=".45"/></svg>
    <span>Color Grading</span>
  </div>
  <div class="actions">
    <button id="btnOpen" class="btn" title="画像を開く (jpg/png/webp…)">
      <svg viewBox="0 0 24 24"><path d="M4 5h6l2 2h8v12H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>開く</span>
    </button>
    <button id="btnCompare" class="btn" title="押している間だけ元画像を表示" disabled>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg><span>比較</span>
    </button>
    <button id="btnSplit" class="btn toggle" title="分割表示 (左: 元画像 / 右: 補正後)" disabled aria-pressed="false">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 5v14" stroke="currentColor" stroke-width="1.8"/></svg><span>分割</span>
    </button>
    <button id="btnSide" class="btn toggle" title="並べて表示 (元画像 / 補正後)" disabled aria-pressed="false">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="8.5" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="6" width="8.5" height="12" rx="1.5" fill="currentColor" opacity=".5" stroke="currentColor" stroke-width="1.8"/></svg><span>並べて</span>
    </button>
    <button id="btnExport" class="btn primary" title="書き出し" disabled>
      <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>書き出し</span>
    </button>
    <button id="btnTheme" class="btn icon" title="ライト / ダーク切替" aria-label="テーマ切替">
      <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <input id="fileInput" type="file" accept="image/*" hidden>
</header>

<main class="workspace">
  <section id="viewer" class="viewer">
    <div id="stage" class="stage">
      <div id="origPane" class="pane" hidden><canvas id="origcanvas"></canvas><span class="pane-label">元画像</span></div>
      <div id="gradedPane" class="pane">
        <canvas id="glcanvas"></canvas>
        <span class="pane-label graded-label">補正後</span>
        <div id="splitHandle" class="split-handle" hidden><div class="split-line"></div><div class="split-knob"></div></div>
      </div>
    </div>
    <div id="dropzone" class="dropzone">
      <div class="dz-inner">
        <svg viewBox="0 0 48 48" width="56" height="56"><rect x="6" y="10" width="36" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="20" r="3.5" fill="currentColor"/><path d="M8 35l11-11 8 8 5-5 8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <p>画像をここにドロップ / ペースト</p>
        <p class="sub">JPEG / PNG / WebP / GIF / BMP / AVIF など、ブラウザが読める形式に対応</p>
        <div class="dz-actions">
          <button id="btnOpen2" class="btn primary">画像を開く</button>
          <button id="btnSample" class="btn">サンプル画像で試す</button>
        </div>
      </div>
    </div>
    <div id="viewerInfo" class="viewer-info" hidden></div>
    <div id="dragOverlay" class="drag-overlay" hidden><span>ドロップして読み込み</span></div>
  </section>

  <aside class="panel">
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="presets" role="tab" aria-selected="true">プリセット</button>
      <button class="tab" data-tab="adjust" role="tab" aria-selected="false">調整</button>
      <button class="tab" data-tab="export" role="tab" aria-selected="false">書き出し</button>
    </nav>

    <section class="tabpane active" data-pane="presets">
      <div id="categories" class="chips"></div>
      <div id="presetGrid" class="preset-grid"></div>
      <div class="controls">
        <div id="stackBar" class="stack-bar" hidden>
          <div class="stack-head"><span>重ねがけ中</span><button id="btnClearStack" class="btn small">すべて解除</button></div>
          <div id="stackList" class="stack-list"></div>
        </div>
        <div class="controls-head">
          <div class="controls-title"><span id="presetName">オリジナル</span><small id="presetDesc"></small></div>
          <button id="btnResetPreset" class="btn small" title="このプリセットのスライダーを初期値に戻す">リセット</button>
        </div>
        <div id="presetControls" class="sliders"></div>
      </div>
    </section>

    <section class="tabpane" data-pane="adjust">
      <div class="controls-head pad">
        <div class="controls-title"><span>基本調整</span><small>プリセットの上に加算されます</small></div>
        <button id="btnResetAdjust" class="btn small">リセット</button>
      </div>
      <div id="adjustControls" class="sliders grow"></div>
    </section>

    <section class="tabpane" data-pane="export">
      <div class="export-form">
        <label class="field">
          <span>形式</span>
          <select id="expFormat">
            <option value="image/jpeg">JPEG (.jpg)</option>
            <option value="image/png">PNG (.png)</option>
            <option value="image/webp">WebP (.webp)</option>
          </select>
        </label>
        <label class="field" id="qualityField">
          <span>品質 <b id="expQualityVal">92</b></span>
          <input id="expQuality" type="range" min="50" max="100" step="1" value="92">
        </label>
        <label class="field">
          <span>サイズ</span>
          <select id="expScale">
            <option value="1">100% (原寸)</option>
            <option value="0.75">75%</option>
            <option value="0.5">50%</option>
            <option value="0.25">25%</option>
          </select>
        </label>
        <p class="note" id="expInfo">画像を読み込むと出力サイズが表示されます。</p>
        <button id="btnDownload" class="btn primary wide" disabled>ダウンロード</button>
        <p class="note small">処理はすべてブラウザ内で行われ、画像がサーバーに送信されることはありません。</p>
      </div>
    </section>
  </aside>
</main>

<div id="toast" class="toast" hidden></div>
<div id="busy" class="busy" hidden><div class="spinner"></div><span id="busyText">処理中…</span></div>
<canvas id="thumbcanvas" hidden></canvas>
<script type="module" src="js/app.js"></script>
</body>
</html>
