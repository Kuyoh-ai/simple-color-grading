name: Deploy to GitHub Pages

# Deploys the repository root as a static site.
# Runs on the default branch (currently claude/sharp-lamport-gx569c) and on main,
# so the site is published automatically on every push without manual setup:
# `enablement: true` turns GitHub Pages on for the repository the first time.
on:
  push:
    branches:
      - main
      - claude/sharp-lamport-gx569c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
